[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-compactor"
version = "0.1.0"
description = "Context compaction for RAG and agents: relevance-score every chunk with a local System 1 decision model and cut tokens before they reach the LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["rag", "context-compaction", "token-optimization", "laya", "system-one"]
dependencies = ["laya>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/laya_compactor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
