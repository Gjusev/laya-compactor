[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-compactor"
version = "0.1.0"
description = "Context compaction for RAG and agents: relevance-score every chunk with a local System 1 decision model and cut tokens before they reach the LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["rag", "context-compaction", "token-optimization", "laya", "system-one"]
dependencies = ["laya>=0.3"]

[project.scripts]
laya-compact = "laya_compactor.cli:main"

[project.optional-dependencies]
eval = ["datasets>=2.20", "rank-bm25>=0.2.2", "tiktoken>=0.7"]
dev = ["pytest>=8", "laya-compactor[eval]"]

[tool.hatch.build.targets.wheel]
packages = ["src/laya_compactor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: loads the real laya checkpoint (downloads on first run); opt in with: pytest -m slow",
]
addopts = "-m 'not slow'"
