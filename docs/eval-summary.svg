<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">laya-compactor benchmark summary</title>
  <desc id="desc">Average input tokens and exact match for full context, head truncation, tail truncation and laya-compactor on SQuAD and HotpotQA.</desc>

  <rect width="1200" height="720" fill="#f7f6f3"/>

  <text x="70" y="72" fill="#191817" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-1">Less context. Measured quality.</text>
  <text x="70" y="108" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="15">200 questions per dataset · shared 1,000-token budget for head, tail and laya-compactor</text>
  <line x1="70" y1="136" x2="1130" y2="136" stroke="#deddd9"/>

  <!-- SQuAD panel -->
  <rect x="70" y="166" width="500" height="448" rx="12" fill="#ffffff" stroke="#e4e3df"/>
  <text x="95" y="208" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2">SQUAD · SINGLE-HOP</text>
  <text x="95" y="238" fill="#191817" font-family="Georgia, 'Times New Roman', serif" font-size="25">Same exact match, 70% fewer tokens</text>
  <text x="220" y="275" fill="#8a8985" font-family="Consolas, Menlo, monospace" font-size="11">AVG INPUT TOKENS ↓</text>
  <text x="502" y="275" fill="#8a8985" font-family="Consolas, Menlo, monospace" font-size="11">EM ↑</text>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14">
    <text x="95" y="314" fill="#4a4947">full</text>
    <rect x="220" y="296" width="210" height="22" rx="5" fill="#f0efec"/>
    <rect x="220" y="296" width="210" height="22" rx="5" fill="#31302e"/>
    <text x="440" y="313" fill="#4a4947" font-family="Consolas, Menlo, monospace" font-size="12">3,214</text>
    <rect x="500" y="293" width="50" height="28" rx="14" fill="#ecebe8"/>
    <text x="525" y="312" text-anchor="middle" fill="#191817" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="bold">.345</text>

    <text x="95" y="374" fill="#6f6e6b">head</text>
    <rect x="220" y="356" width="210" height="22" rx="5" fill="#f0efec"/>
    <rect x="220" y="356" width="69" height="22" rx="5" fill="#c9d2d9"/>
    <text x="299" y="373" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">1,050</text>
    <rect x="500" y="353" width="50" height="28" rx="14" fill="#f2f1ee"/>
    <text x="525" y="372" text-anchor="middle" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">.320</text>

    <text x="95" y="434" fill="#6f6e6b">tail</text>
    <rect x="220" y="416" width="210" height="22" rx="5" fill="#f0efec"/>
    <rect x="220" y="416" width="68" height="22" rx="5" fill="#c9d2d9"/>
    <text x="298" y="433" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">1,040</text>
    <rect x="500" y="413" width="50" height="28" rx="14" fill="#f2f1ee"/>
    <text x="525" y="432" text-anchor="middle" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">.265</text>

    <text x="95" y="494" fill="#1f6c9f" font-weight="bold">laya-compactor</text>
    <rect x="220" y="476" width="210" height="22" rx="5" fill="#edf3f7"/>
    <rect x="220" y="476" width="64" height="22" rx="5" fill="#1f6c9f"/>
    <text x="294" y="493" fill="#1f6c9f" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="bold">973</text>
    <rect x="500" y="473" width="50" height="28" rx="14" fill="#e1f3fe"/>
    <text x="525" y="492" text-anchor="middle" fill="#1f6c9f" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="bold">.345</text>
  </g>

  <line x1="95" y1="536" x2="545" y2="536" stroke="#ecebe8"/>
  <text x="95" y="570" fill="#1f6c9f" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold">2,241 fewer input tokens</text>
  <text x="95" y="592" fill="#6f6e6b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13">with no measured exact-match loss</text>

  <!-- HotpotQA panel -->
  <rect x="630" y="166" width="500" height="448" rx="12" fill="#ffffff" stroke="#e4e3df"/>
  <text x="655" y="208" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2">HOTPOTQA · MULTI-HOP</text>
  <text x="655" y="238" fill="#191817" font-family="Georgia, 'Times New Roman', serif" font-size="25">Bridge documents make the tradeoff real</text>
  <text x="780" y="275" fill="#8a8985" font-family="Consolas, Menlo, monospace" font-size="11">AVG INPUT TOKENS ↓</text>
  <text x="1062" y="275" fill="#8a8985" font-family="Consolas, Menlo, monospace" font-size="11">EM ↑</text>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14">
    <text x="655" y="314" fill="#4a4947">full</text>
    <rect x="780" y="296" width="210" height="22" rx="5" fill="#f0efec"/>
    <rect x="780" y="296" width="210" height="22" rx="5" fill="#31302e"/>
    <text x="1000" y="313" fill="#4a4947" font-family="Consolas, Menlo, monospace" font-size="12">1,440</text>
    <rect x="1060" y="293" width="50" height="28" rx="14" fill="#ecebe8"/>
    <text x="1085" y="312" text-anchor="middle" fill="#191817" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="bold">.230</text>

    <text x="655" y="374" fill="#6f6e6b">head</text>
    <rect x="780" y="356" width="210" height="22" rx="5" fill="#f0efec"/>
    <rect x="780" y="356" width="152" height="22" rx="5" fill="#c9d2d9"/>
    <text x="942" y="373" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">1,042</text>
    <rect x="1060" y="353" width="50" height="28" rx="14" fill="#f2f1ee"/>
    <text x="1085" y="372" text-anchor="middle" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">.175</text>

    <text x="655" y="434" fill="#6f6e6b">tail</text>
    <rect x="780" y="416" width="210" height="22" rx="5" fill="#f0efec"/>
    <rect x="780" y="416" width="152" height="22" rx="5" fill="#c9d2d9"/>
    <text x="942" y="433" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">1,041</text>
    <rect x="1060" y="413" width="50" height="28" rx="14" fill="#f2f1ee"/>
    <text x="1085" y="432" text-anchor="middle" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">.110</text>

    <text x="655" y="494" fill="#1f6c9f" font-weight="bold">laya-compactor</text>
    <rect x="780" y="476" width="210" height="22" rx="5" fill="#edf3f7"/>
    <rect x="780" y="476" width="143" height="22" rx="5" fill="#1f6c9f"/>
    <text x="933" y="493" fill="#1f6c9f" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="bold">979</text>
    <rect x="1060" y="473" width="50" height="28" rx="14" fill="#e1f3fe"/>
    <text x="1085" y="492" text-anchor="middle" fill="#1f6c9f" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="bold">.200</text>
  </g>

  <line x1="655" y1="536" x2="1105" y2="536" stroke="#ecebe8"/>
  <text x="655" y="570" fill="#1f6c9f" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold">94.5% of gold documents kept</text>
  <text x="655" y="592" fill="#6f6e6b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13">0.200 EM vs 0.230 for unbudgeted full context</text>

  <text x="70" y="666" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">Bars are normalized to full context within each dataset · exact match uses SQuAD-style normalization</text>
  <text x="1130" y="666" text-anchor="end" fill="#6f6e6b" font-family="Consolas, Menlo, monospace" font-size="12">source: reproducible eval harness</text>
</svg>
